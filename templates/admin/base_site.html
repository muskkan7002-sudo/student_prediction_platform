{% extends "admin/base.html" %}
{% load static %}

{% block extrastyle %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'css/admin.css' %}?v=2">
{% endblock %}

{% block branding %}
<div id="site-name">
    <a href="{% url 'admin:index' %}" class="admin-brand">
        <span class="admin-brand-mark">E</span>
        <span>EduInsight <small>ADMINISTRATION</small></span>
    </a>
</div>
{% endblock %}

{% block welcome-msg %}
    <span class="welcome-label">Welcome,</span> <strong>{% firstof user.get_short_name user.get_username %}</strong>.
{% endblock %}
